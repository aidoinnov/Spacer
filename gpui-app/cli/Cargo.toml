[package]
name = "spacer-cli"
version = "0.3.2"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
chrono = "0.4"
tempfile = "3"

[features]
qa = []

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
